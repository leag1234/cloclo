<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>ATLAS — Projets et mémoire</title>
<body><h1>Projets et mémoire</h1>
<p>Les faits mémorisés sont partagés entre les conversations du projet sélectionné.</p>
<label>Projet <select id="projects"></select></label><button id="create-project">Créer un projet</button>
<p><label>Instructions permanentes<br><textarea id="instructions" rows="4" cols="70" maxlength="4000"></textarea></label><button id="save-project">Enregistrer</button></p>
<label>Conversation <select id="conversations"></select></label><button id="create-conversation">Nouvelle conversation</button>
<h2>Documents et notes du projet</h2><ul id="documents"></ul>
<label>Titre <input id="document-name" maxlength="120"></label><br>
<label>Texte ou note<br><textarea id="document-text" rows="5" cols="70" maxlength="32000"></textarea></label>
<button id="add-document">Ajouter au projet</button>
<h2>Mémoire</h2><ul id="facts"></ul><button id="erase">Effacer toute la mémoire</button>
<h2>Conversation</h2><div id="history"></div>
<label>Message<br><textarea id="question" rows="4" cols="70" maxlength="32000"></textarea></label><button id="send">Envoyer</button>
<p id="status" role="status"></p><script src="/project-ui.js" defer></script></body></html>
