# E6 — Web Q/R : 20 questions dont la réponse vit sur le web
# Champs: cle_de_correction (la réponse attendue), verification (comment la re-vérifier),
#         date_cle (date de validité de la clé), statut stale géré par POC-R3.
# 2 cas vérifiés le 2026-07-23 (sources officielles) ; 18 à vérifier à la création du jeu
# (méthode fournie — ~2 min/cas, délégable à l'agent PUIS relu par l'humain).

- id: E6-001
  lang: fr
  source: verifie-web
  statut: valide
  valide_par: "Claude + sources officielles BCE/Banque de France"
  date_cle: 2026-07-23
  input: "Quels sont les taux directeurs actuels de la BCE ?"
  cle_de_correction:
    doit_contenir: ["2,25", "2,40", "2,65"]
    contexte: "Facilité de dépôt 2,25 % ; refinancement principal 2,40 % ; prêt marginal
               2,65 %. Confirmés inchangés par le Conseil des gouverneurs du 23/07/2026."
  verification: "ecb.europa.eu → communiqués de politique monétaire (dernier en date)"
  doit_citer_domaine_parmi: ["ecb.europa.eu", "banque-france.fr"]

- id: E6-002
  lang: de
  source: verifie-web
  statut: valide
  valide_par: "Claude + BMAS/Bundesregierung/Destatis"
  date_cle: 2026-07-23
  input: "Wie hoch ist der gesetzliche Mindestlohn in Deutschland aktuell?"
  cle_de_correction:
    doit_contenir: ["13,90"]
    contexte: "13,90 €/h depuis le 01/01/2026 (12,82 € en 2025 ; 14,60 € prévu au
               01/01/2027). Cinquième Mindestlohnanpassungsverordnung."
  verification: "bmas.de ou bundesregierung.de → Mindestlohn"
  doit_citer_domaine_parmi: ["bmas.de", "bundesregierung.de", "destatis.de", "dgb.de"]

